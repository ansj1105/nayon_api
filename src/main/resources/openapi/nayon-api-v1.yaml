openapi: 3.1.0
info:
  title: NYAON API
  version: 1.7.0
  description: Social-account-isolated profile, cloud save, economy, store purchase, subscription, reward, gacha, and battle audit API.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /me:
    get:
      operationId: getMe
      responses:
        '200':
          description: Current player account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      operationId: updateMyProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Updated player account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /me/settings:
    get:
      operationId: getMySettings
      responses:
        '200':
          description: Current account-scoped game settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerSettingsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      operationId: patchMySettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlayerSettingsPatchRequest'
      responses:
        '200':
          description: Updated account-scoped game settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerSettingsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /me/wallet-links/korion:
    get:
      operationId: getMyKorionWalletLink
      responses:
        '200':
          description: Current verified link and active request state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KorionWalletLinkResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      operationId: unlinkMyKorionWallet
      responses:
        '204':
          description: Link removed; previously claimed reward remains claimed
        '401':
          $ref: '#/components/responses/Unauthorized'
  /me/wallet-links/korion/requests:
    post:
      operationId: requestMyKorionWalletLink
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KorionWalletLinkCreateRequest'
      responses:
        '202':
          description: Push-signature request created or active request replayed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KorionWalletLinkResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /me/wallet-links/korion/requests/{requestId}:
    get:
      operationId: getMyKorionWalletLinkRequest
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Reconciled request and verified link state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KorionWalletLinkResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /me/account-link-reward/claim:
    post:
      operationId: claimMyAccountLinkReward
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Exact-once reward state with authoritative economy snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountLinkRewardResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
  /me/account-link-reward:
    get:
      operationId: getMyAccountLinkReward
      responses:
        '200':
          description: Current dual-link eligibility and lifetime claim state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountLinkRewardResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /legal-documents/{type}:
    get:
      operationId: getLegalDocument
      security: []
      parameters:
        - name: type
          in: path
          required: true
          schema:
            type: string
            enum: [privacy-policy, terms-of-service]
        - name: locale
          in: query
          required: false
          schema:
            type: string
            default: ko
            pattern: '^[a-zA-Z]{2}(?:-[a-zA-Z0-9]{2,8})?$'
      responses:
        '200':
          description: Currently active approved legal document
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegalDocumentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /me/share-reward:
    get:
      operationId: getMyShareReward
      responses:
        '200':
          description: Lifetime share and reward state for the current account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareRewardResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /me/share-reward/share-opened:
    post:
      operationId: markMyShareOpened
      description: Records that the native sharesheet opened; it does not assert external delivery success.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShareOpenedRequest'
      responses:
        '200':
          description: Idempotent lifetime shared state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareRewardResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /me/share-reward/claim:
    post:
      operationId: claimMyShareReward
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Current state; retries never grant more than once
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareRewardResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
  /store/catalog:
    get:
      operationId: getStoreCatalog
      description: Returns active server reward mappings. Localized prices remain owned by Google Play.
      parameters:
        - name: platform
          in: query
          required: true
          schema:
            type: string
            enum: [GOOGLE_PLAY]
      responses:
        '200':
          description: Active one-time product catalog for the current account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreCatalogResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /store/purchases/google-play/verify:
    post:
      operationId: verifyGooglePlayPurchase
      description: Verifies an opaque Google purchase token and grants the configured reward at most once.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GooglePlayPurchaseVerifyRequest'
      responses:
        '200':
          description: Existing result for an identical retry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorePurchaseResponse'
        '201':
          description: Google-verified purchase granted by the authoritative economy ledger
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorePurchaseResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /store/first-purchase-reward:
    get:
      operationId: getFirstPurchaseReward
      description: Returns the current account's server-authoritative first Google Play purchase reward state.
      responses:
        '200':
          description: Reward state before or after the account's first verified purchase
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FirstPurchaseRewardResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /subscriptions/catalog:
    get:
      operationId: getSubscriptionCatalog
      description: Returns independent monthly subscription products and server-owned benefit values. Prices remain owned by Google Play.
      parameters:
        - name: platform
          in: query
          required: true
          schema:
            type: string
            enum: [GOOGLE_PLAY]
      responses:
        '200':
          description: Active monthly subscription catalog
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionCatalogResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /me/subscriptions:
    get:
      operationId: getMySubscriptions
      responses:
        '200':
          description: Current account subscription entitlement states
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /store/subscriptions/google-play/verify:
    post:
      operationId: verifyGooglePlaySubscription
      description: Verifies Google subscriptions v2 state and updates one independent account entitlement.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionVerifyRequest'
      responses:
        '200':
          description: Existing result for an identical request or token retry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionVerifyResponse'
        '201':
          description: Subscription state verified and persisted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionVerifyResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /public/google-play/rtdn:
    post:
      operationId: receiveGooglePlayRtdn
      description: Authenticated Google Pub/Sub push; the server fetches subscriptions v2 state before changing entitlement.
      security:
        - googleOidc: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GooglePlayRtdnPushRequest'
      responses:
        '204':
          description: New or duplicate notification accepted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /me/level-rewards:
    get:
      operationId: getMyLevelRewards
      responses:
        '200':
          description: Server account level, independent subscription states, and lifetime claim state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LevelRewardListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
  /me/level-rewards/{trackCode}/{requiredLevel}/claim:
    post:
      operationId: claimLevelReward
      parameters:
        - name: trackCode
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/LevelRewardTrackCode'
        - name: requiredLevel
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 50
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Existing result for an identical retry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LevelRewardClaimResponse'
        '201':
          description: Lifetime reward granted once by the authoritative ledger
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LevelRewardClaimResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /me/subscriptions/{planCode}/daily-reward/claim:
    post:
      operationId: claimSubscriptionDailyReward
      parameters:
        - name: planCode
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/SubscriptionPlanCode'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Existing result for an identical daily reward retry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionDailyRewardResponse'
        '201':
          description: Active-plan daily reward granted once for the server date
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionDailyRewardResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /save:
    get:
      operationId: getCloudSave
      responses:
        '200':
          description: Current cloud save
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaveResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: putCloudSave
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveWriteRequest'
      responses:
        '200':
          description: Stored cloud save
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaveResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
  /save/import:
    post:
      operationId: importLocalSave
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveImportRequest'
      responses:
        '200':
          description: Existing result for an identical retry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaveResponse'
        '201':
          description: Imported local save
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaveResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
  /economy:
    get:
      operationId: getEconomy
      responses:
        '200':
          description: Current authoritative economy state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EconomyResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /economy/bootstrap:
    post:
      operationId: bootstrapEconomy
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EconomyBootstrapRequest'
      responses:
        '200':
          description: Existing result for an identical retry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EconomyResponse'
        '201':
          description: Economy bootstrapped from the existing local account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EconomyResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
  /gacha/draws:
    post:
      operationId: createGachaDraw
      description: Atomically debits payment, resolves server RNG and pity, grants equipment, and stores history.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GachaDrawRequest'
      responses:
        '200':
          description: Existing result for an identical retry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GachaDrawResponse'
        '201':
          description: Completed server-authoritative draw
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GachaDrawResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    get:
      operationId: listGachaDraws
      parameters:
        - name: before
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        '200':
          description: Account-isolated newest-first gacha history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GachaHistoryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /battles:
    post:
      operationId: startBattle
      description: Issues an expiring server battle session using a versioned stage snapshot.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BattleStartRequest'
      responses:
        '200':
          description: Existing session for an identical retry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BattleSessionResponse'
        '201':
          description: Issued battle session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BattleSessionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
    get:
      operationId: listBattles
      parameters:
        - name: before
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        '200':
          description: Account-isolated completed battle history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BattleHistoryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /offline-battles/sync:
    post:
      operationId: syncOfflineBattleWindow
      description: Replaces the account's offline play window using server timestamps only.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Existing window for an identical retry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfflineBattleWindowResponse'
        '201':
          description: Server-timed offline play window
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfflineBattleWindowResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
  /offline-battles:
    post:
      operationId: submitOfflineBattles
      description: Consumes server-issued elapsed-time budget and atomically decides pending run rewards.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OfflineBattleSubmissionRequest'
      responses:
        '200':
          description: Existing decision for an identical retry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfflineBattleSubmissionResponse'
        '201':
          description: Durable offline battle decision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfflineBattleSubmissionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
  /battles/{battleId}/complete:
    post:
      operationId: completeBattle
      description: Stores metrics, evaluates deterministic anomaly rules, and grants or holds reward atomically.
      parameters:
        - name: battleId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BattleCompleteRequest'
      responses:
        '200':
          description: Existing completion for an identical retry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BattleCompletionResponse'
        '201':
          description: Durable battle completion and reward decision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BattleCompletionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /events/limited-benefits/current:
    get:
      operationId: getCurrentLimitedBenefit
      responses:
        '200':
          description: Current server-authoritative daily campaign
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LimitedBenefitCampaignResponse'
        '204':
          description: No active campaign
        '401':
          $ref: '#/components/responses/Unauthorized'
  /events/limited-benefits/offers/{offerCode}/claims:
    post:
      operationId: claimLimitedBenefitOffer
      parameters:
        - name: offerCode
          in: path
          required: true
          schema:
            type: string
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LimitedBenefitClaimRequest'
      responses:
        '200':
          description: Reward granted exactly once or replayed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LimitedBenefitClaimResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /events/limited-benefits/offers/{offerCode}/ad-sessions:
    post:
      operationId: createLimitedBenefitAdSession
      parameters:
        - name: offerCode
          in: path
          required: true
          schema: { type: string }
      responses:
        '201':
          description: Pending account-scoped AdMob SSV session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LimitedBenefitAdSessionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /public/admob/rewarded-callback:
    get:
      operationId: acceptAdMobRewardedCallback
      security: []
      description: Validates the original ordered AdMob SSV query and marks its session verified without granting economy.
      responses:
        '200':
          description: Callback accepted or exact transaction replay accepted
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    googleOidc:
      type: http
      scheme: bearer
      bearerFormat: Google OIDC JWT
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID generated once for a logical write command.
      schema:
        type: string
        format: uuid
      example: 6bf5aa51-f26c-42df-bfc4-f52c4cae1356
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthorized:
      description: Missing or invalid access token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: Authenticated caller is not authorized for this endpoint
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Conflict:
      description: Revision, idempotency, duplicate command, or invalid current-state conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    UnprocessableEntity:
      description: Valid command cannot be completed with the current account state
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    TooManyRequests:
      description: Request rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ServiceUnavailable:
      description: Dependent service is unavailable or not configured
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    LimitedBenefitCampaignResponse:
      type: object
      required: [campaignVersionId, campaignCode, version, serverTime, cycleDate, resetsAt, offers]
      properties:
        campaignVersionId: { type: string, format: uuid }
        campaignCode: { type: string }
        version: { type: integer, minimum: 1 }
        serverTime: { type: string, format: date-time }
        cycleDate: { type: string, format: date }
        resetsAt: { type: string, format: date-time }
        offers:
          type: array
          items: { $ref: '#/components/schemas/LimitedBenefitOffer' }
    LimitedBenefitOffer:
      type: object
      required: [offerCode, displayOrder, title, fulfillmentType, state, rewards]
      properties:
        offerCode: { type: string }
        displayOrder: { type: integer, minimum: 0 }
        title: { type: string }
        fulfillmentType:
          type: string
          enum: [FREE, GOOGLE_PLAY, ADMOB_SSV]
        productId: { type: [string, 'null'] }
        state:
          type: string
          enum: [LOCKED, AVAILABLE, PROVIDER_UNAVAILABLE, CLAIMED]
        rewards:
          type: array
          items: { $ref: '#/components/schemas/LimitedBenefitReward' }
    LimitedBenefitReward:
      type: object
      required: [type, code, amount]
      properties:
        type:
          type: string
          enum: [CURRENCY, ITEM, EQUIPMENT_BOX]
        code: { type: string }
        amount: { type: integer, format: int64, minimum: 1 }
    LimitedBenefitClaimRequest:
      type: object
      description: FREE는 빈 본문, GOOGLE_PLAY는 receiptId, ADMOB_SSV는 adSessionId만 전달한다.
      properties:
        receiptId: { type: [string, 'null'], format: uuid }
        adSessionId: { type: [string, 'null'], format: uuid }
    LimitedBenefitClaimResponse:
      type: object
      required: [claimId, offerCode, cycleDate, rewards, economy, replay]
      properties:
        claimId: { type: string, format: uuid }
        offerCode: { type: string }
        cycleDate: { type: string, format: date }
        rewards:
          type: array
          items: { $ref: '#/components/schemas/LimitedBenefitReward' }
        economy: { $ref: '#/components/schemas/EconomyResponse' }
        replay: { type: boolean }
    LimitedBenefitAdSessionResponse:
      type: object
      additionalProperties: false
      required: [sessionId, customData, userId, adUnitId, status, expiresAt]
      properties:
        sessionId: { type: string, format: uuid }
        customData: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        adUnitId: { type: string, minLength: 1 }
        status:
          type: string
          enum: [PENDING, VERIFIED]
        expiresAt: { type: string, format: date-time }
    SubscriptionPlanCode:
      type: string
      enum: [MONTHLY_GROWTH, MONTHLY_ADVANCED]
    SubscriptionState:
      type: string
      enum: [PENDING, ACTIVE, CANCELED, GRACE_PERIOD, ON_HOLD, PAUSED, EXPIRED, REVOKED]
    SubscriptionBenefit:
      type: object
      additionalProperties: false
      required: [code, value, version]
      properties:
        code:
          type: string
          enum: [INITIAL_DIAMOND, DAILY_DIAMOND, SKILL_REFRESH_COUNT, REVIVE_COUNT, MAX_ENERGY, GOLD_BONUS_BPS, BATTLE_SPEED_UNLOCK, REWARDED_AD_SKIP]
        value:
          type: integer
          format: int64
          minimum: 1
        version:
          type: integer
          minimum: 1
    SubscriptionCatalogPlan:
      type: object
      additionalProperties: false
      required: [planCode, productId, productType, rewardTrackCode, benefits]
      properties:
        planCode:
          $ref: '#/components/schemas/SubscriptionPlanCode'
        productId:
          type: string
          minLength: 1
          maxLength: 200
        productType:
          type: string
          enum: [SUBSCRIPTION]
        rewardTrackCode:
          $ref: '#/components/schemas/LevelRewardTrackCode'
        benefits:
          type: array
          items:
            $ref: '#/components/schemas/SubscriptionBenefit'
    SubscriptionCatalogResponse:
      type: object
      additionalProperties: false
      required: [platform, obfuscatedAccountId, plans]
      properties:
        platform:
          type: string
          enum: [GOOGLE_PLAY]
        obfuscatedAccountId:
          type: string
          pattern: '^[0-9a-f]{64}$'
        plans:
          type: array
          items:
            $ref: '#/components/schemas/SubscriptionCatalogPlan'
    SubscriptionEntitlement:
      type: object
      additionalProperties: false
      required: [planCode, state, entitled, autoRenewing]
      properties:
        planCode:
          $ref: '#/components/schemas/SubscriptionPlanCode'
        state:
          $ref: '#/components/schemas/SubscriptionState'
        entitled:
          type: boolean
        autoRenewing:
          type: boolean
        startedAt:
          type: [string, 'null']
          format: date-time
        expiresAt:
          type: [string, 'null']
          format: date-time
        lastVerifiedAt:
          type: [string, 'null']
          format: date-time
    SubscriptionListResponse:
      type: object
      additionalProperties: false
      required: [serverTime, subscriptions]
      properties:
        serverTime:
          type: string
          format: date-time
        subscriptions:
          type: array
          items:
            $ref: '#/components/schemas/SubscriptionEntitlement'
    SubscriptionVerifyRequest:
      type: object
      additionalProperties: false
      required: [productId, purchaseToken]
      properties:
        productId:
          type: string
          minLength: 1
          maxLength: 200
        purchaseToken:
          type: string
          minLength: 1
          maxLength: 4096
    SubscriptionRewardGrant:
