openapi: 3.1.0
info:
  title: NYAON API
  version: 1.2.0
  description: Social-account-isolated profile, cloud save, economy, and server gacha API.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /me:
    get:
      operationId: getMe
      responses:
        '200':
          description: Current player account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      operationId: updateMyProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Updated player account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /save:
    get:
      operationId: getCloudSave
      responses:
        '200':
          description: Current cloud save
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaveResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: putCloudSave
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveWriteRequest'
      responses:
        '200':
          description: Stored cloud save
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaveResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
  /save/import:
    post:
      operationId: importLocalSave
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveImportRequest'
      responses:
        '200':
          description: Existing result for an identical retry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaveResponse'
        '201':
          description: Imported local save
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaveResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
  /economy:
    get:
      operationId: getEconomy
      responses:
        '200':
          description: Current authoritative economy state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EconomyResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /economy/bootstrap:
    post:
      operationId: bootstrapEconomy
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EconomyBootstrapRequest'
      responses:
        '200':
          description: Existing result for an identical retry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EconomyResponse'
        '201':
          description: Economy bootstrapped from the existing local account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EconomyResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
  /gacha/draws:
    post:
      operationId: createGachaDraw
      description: Atomically debits payment, resolves server RNG and pity, grants equipment, and stores history.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GachaDrawRequest'
      responses:
        '200':
          description: Existing result for an identical retry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GachaDrawResponse'
        '201':
          description: Completed server-authoritative draw
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GachaDrawResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
    get:
      operationId: listGachaDraws
      parameters:
        - name: before
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        '200':
          description: Account-isolated newest-first gacha history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GachaHistoryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID generated once for a logical write command.
      schema:
        type: string
        format: uuid
      example: 6bf5aa51-f26c-42df-bfc4-f52c4cae1356
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthorized:
      description: Missing or invalid access token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Conflict:
      description: Revision or idempotency conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    MeResponse:
      type: object
      additionalProperties: false
      required: [publicId, status, nickname, createdAt]
      properties:
        publicId:
          type: string
          maxLength: 32
          example: NYAON-A1B2C3D4
        status:
          type: string
          enum: [ACTIVE, SUSPENDED, DELETED]
        nickname:
          type: string
          minLength: 1
          maxLength: 30
          example: NyaonHunter
        avatarCode:
          type: [string, 'null']
          maxLength: 80
        frameCode:
          type: [string, 'null']
          maxLength: 80
        locale:
          type: [string, 'null']
          maxLength: 16
          example: ko-KR
        createdAt:
          type: string
          format: date-time
    UpdateProfileRequest:
      type: object
      additionalProperties: false
      properties:
        nickname:
          type: string
          minLength: 1
          maxLength: 30
        avatarCode:
          type: [string, 'null']
          maxLength: 80
        frameCode:
          type: [string, 'null']
          maxLength: 80
    SaveWriteRequest:
      type: object
      additionalProperties: false
      required: [expectedRevision, schemaVersion, payload, checksum, clientBuild]
      properties:
        expectedRevision:
          type: integer
          format: int64
          minimum: 0
          example: 4
        schemaVersion:
          type: integer
          minimum: 1
          example: 1
        payload:
          type: object
          additionalProperties: true
        checksum:
          type: string
          pattern: '^[0-9a-f]{64}$'
        clientBuild:
          type: string
          minLength: 1
          maxLength: 40
          example: 0.1.0-android
    SaveImportRequest:
      type: object
      additionalProperties: false
      required: [schemaVersion, payload, checksum, clientBuild]
      properties:
        schemaVersion:
          type: integer
          minimum: 1
        payload:
          type: object
          additionalProperties: true
        checksum:
          type: string
          pattern: '^[0-9a-f]{64}$'
        clientBuild:
          type: string
          minLength: 1
          maxLength: 40
    SaveResponse:
      type: object
      additionalProperties: false
      required: [schemaVersion, revision, payload, checksum, clientBuild, updatedAt]
      properties:
        schemaVersion:
          type: integer
          minimum: 1
        revision:
          type: integer
          format: int64
          minimum: 0
        payload:
          type: object
          additionalProperties: true
        checksum:
          type: string
          pattern: '^[0-9a-f]{64}$'
        clientBuild:
          type: string
          maxLength: 40
        updatedAt:
          type: string
          format: date-time
    EconomyBootstrapRequest:
      type: object
      additionalProperties: false
      required: [currencies, items, equipment]
      properties:
        currencies:
          type: object
          additionalProperties: false
          properties:
            DIAMOND:
              type: integer
              format: int64
              minimum: 0
              maximum: 1000000000
            GOLD:
              type: integer
              format: int64
              minimum: 0
              maximum: 1000000000
        items:
          type: object
          additionalProperties: false
          properties:
            SILVER_KEY:
              type: integer
              format: int64
              minimum: 0
              maximum: 1000000000
            GOLD_KEY:
              type: integer
              format: int64
              minimum: 0
              maximum: 1000000000
            CHROMA_FRAGMENT:
              type: integer
              format: int64
              minimum: 0
              maximum: 1000000000
        equipment:
          type: array
          description: Expanded sum of all quantity values must not exceed 10000.
          maxItems: 10000
          items:
            $ref: '#/components/schemas/EconomyBootstrapEquipment'
    EconomyBootstrapEquipment:
      type: object
      additionalProperties: false
      required: [equipmentCode, grade, quantity]
      properties:
        equipmentCode:
          type: string
          minLength: 1
          maxLength: 80
        grade:
          type: string
          enum: [COMMON, UNCOMMON, RARE, EPIC, UNIQUE]
        quantity:
          type: integer
          minimum: 1
          maximum: 10000
    EconomyResponse:
      type: object
      additionalProperties: false
      required: [bootstrapped, currencies, items, equipment]
      properties:
        bootstrapped:
          type: boolean
        currencies:
          type: object
          additionalProperties:
            type: integer
            format: int64
            minimum: 0
        items:
          type: object
          additionalProperties:
            type: integer
            format: int64
            minimum: 0
        equipment:
          type: array
          items:
            $ref: '#/components/schemas/PlayerEquipment'
    PlayerEquipment:
      type: object
      additionalProperties: false
      required: [id, equipmentCode, grade, level, locked]
      properties:
        id:
          type: string
          format: uuid
        equipmentCode:
          type: string
          maxLength: 80
        grade:
          type: string
          enum: [COMMON, UNCOMMON, RARE, EPIC, UNIQUE]
        level:
          type: integer
          minimum: 1
        locked:
          type: boolean
    GachaDrawRequest:
      type: object
      additionalProperties: false
      required: [banner, payment, count]
      properties:
        banner:
          type: string
          enum: [COMMON, ADVANCED, CHROMA_SEASON_01]
        payment:
          type: string
          enum: [SILVER_KEY, GOLD_KEY, CHROMA_FRAGMENT, DIAMOND]
        count:
          type: integer
          minimum: 1
          maximum: 10
      description: Supported combinations are COMMON/SILVER_KEY/1, ADVANCED/GOLD_KEY/1, CHROMA_SEASON_01/CHROMA_FRAGMENT/1, and CHROMA_SEASON_01/DIAMOND/10.
    GachaAward:
      type: object
      additionalProperties: false
      required: [equipmentId, equipmentCode, grade, chroma]
      properties:
        equipmentId:
          type: string
          format: uuid
        equipmentCode:
          type: string
          maxLength: 80
        grade:
          type: string
          enum: [COMMON, UNCOMMON, RARE, EPIC, UNIQUE]
        chroma:
          type: boolean
    GachaDrawResponse:
      type: object
      additionalProperties: false
      required: [drawId, banner, payment, paymentAmount, results, heroPity, legendaryPity, economy, createdAt, replay]
      properties:
        drawId:
          type: string
          format: uuid
        banner:
          type: string
          enum: [COMMON, ADVANCED, CHROMA_SEASON_01]
        payment:
          type: string
          enum: [SILVER_KEY, GOLD_KEY, CHROMA_FRAGMENT, DIAMOND]
        paymentAmount:
          type: integer
          format: int64
          minimum: 1
        results:
          type: array
          minItems: 1
          maxItems: 10
          items:
            $ref: '#/components/schemas/GachaAward'
        heroPity:
          type: integer
          minimum: 0
        legendaryPity:
          type: integer
          minimum: 0
        economy:
          $ref: '#/components/schemas/EconomyResponse'
        createdAt:
          type: string
          format: date-time
        replay:
          type: boolean
    GachaHistoryResponse:
      type: object
      additionalProperties: false
      required: [draws]
      properties:
        draws:
          type: array
          items:
            $ref: '#/components/schemas/GachaDrawResponse'
        nextCursor:
          type: [string, 'null']
          format: uuid
    ApiError:
      type: object
      additionalProperties: false
      required: [code, message, traceId, details]
      properties:
        code:
          type: string
          example: SAVE_REVISION_CONFLICT
        message:
          type: string
          example: The cloud save has changed.
        traceId:
          type: string
        details:
          type: object
          additionalProperties: true
