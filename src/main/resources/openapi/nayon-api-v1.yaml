      properties:
        assetCode:
          type: string
          enum: [DIAMOND]
        amount:
          type: integer
          format: int64
          minimum: 1
        balance:
          type: integer
          format: int64
          minimum: 0
    SubscriptionVerifyResponse:
      type: object
