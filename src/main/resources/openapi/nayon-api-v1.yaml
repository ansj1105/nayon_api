          minLength: 1
          maxLength: 80
        grade:
          type: string
          enum: [COMMON, UNCOMMON, RARE, EPIC, UNIQUE]
        quantity:
          type: integer
          minimum: 1
          maximum: 10000
    EconomyResponse:
      type: object
      additionalProperties: false
      required: [bootstrapped, currencies, items, equipment]
      properties:
        bootstrapped:
          type: boolean
        currencies:
          type: object
          additionalProperties:
            type: integer
            format: int64
            minimum: 0
        items:
          type: object
          additionalProperties:
            type: integer
            format: int64
            minimum: 0
        equipment:
          type: array
          items:
            $ref: '#/components/schemas/PlayerEquipment'
    PlayerEquipment:
      type: object
      additionalProperties: false
      required: [id, equipmentCode, grade, level, locked]
      properties:
        id:
          type: string
          format: uuid
        equipmentCode:
          type: string
          maxLength: 80
        grade:
          type: string
          enum: [COMMON, UNCOMMON, RARE, EPIC, UNIQUE]
        level:
          type: integer
          minimum: 1
        locked:
          type: boolean
    GachaDrawRequest:
      type: object
      additionalProperties: false
      required: [banner, payment, count]
      properties:
        banner:
          type: string
          enum: [COMMON, ADVANCED, CHROMA_SEASON_01]
        payment:
          type: string
          enum: [SILVER_KEY, GOLD_KEY, CHROMA_FRAGMENT, DIAMOND]
        count:
          type: integer
          minimum: 1
          maximum: 10
      description: Supported combinations are COMMON/SILVER_KEY/1, ADVANCED/GOLD_KEY/1, CHROMA_SEASON_01/CHROMA_FRAGMENT/1, and CHROMA_SEASON_01/DIAMOND/10.
    GachaAward:
      type: object
      additionalProperties: false
      required: [equipmentId, equipmentCode, grade, chroma]
      properties:
        equipmentId:
          type: string
          format: uuid
        equipmentCode:
          type: string
          maxLength: 80
        grade:
          type: string
          enum: [COMMON, UNCOMMON, RARE, EPIC, UNIQUE]
        chroma:
          type: boolean
    GachaDrawResponse:
      type: object
      additionalProperties: false
      required: [drawId, banner, payment, paymentAmount, results, heroPity, legendaryPity, economy, createdAt, replay]
      properties:
        drawId:
          type: string
          format: uuid
        banner:
          type: string
          enum: [COMMON, ADVANCED, CHROMA_SEASON_01]
        payment:
          type: string
          enum: [SILVER_KEY, GOLD_KEY, CHROMA_FRAGMENT, DIAMOND]
        paymentAmount:
          type: integer
          format: int64
          minimum: 1
        results:
          type: array
          minItems: 1
          maxItems: 10
          items:
            $ref: '#/components/schemas/GachaAward'
        heroPity:
          type: integer
          minimum: 0
        legendaryPity:
          type: integer
          minimum: 0
        economy:
          $ref: '#/components/schemas/EconomyResponse'
        createdAt:
          type: string
          format: date-time
        replay:
          type: boolean
    GachaHistoryResponse:
      type: object
      additionalProperties: false
      required: [draws]
      properties:
        draws:
          type: array
          items:
            $ref: '#/components/schemas/GachaDrawResponse'
        nextCursor:
          type: [string, 'null']
          format: uuid
    OfflineBattleWindowResponse:
      type: object
      additionalProperties: false
      required: [windowId, openedAt, expiresAt, replay]
      properties:
        windowId:
          type: string
          format: uuid
        openedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        replay:
          type: boolean
    OfflineBattleRunRequest:
      type: object
      additionalProperties: false
      required: [runId, stageCode, outcome, elapsedSeconds, killCount, totalDamage, reachedWave]
      properties:
        runId:
          type: string
          format: uuid
        stageCode:
          type: string
          minLength: 1
          maxLength: 80
        outcome:
          type: string
          enum: [CLEAR, LOSS, ABANDONED]
        elapsedSeconds:
          type: integer
          minimum: 0
          maximum: 86400
        killCount:
          type: integer
          minimum: 0
        totalDamage:
          type: number
          minimum: 0
          multipleOf: 0.0001
        reachedWave:
          type: integer
          minimum: 0
    OfflineBattleSubmissionRequest:
      type: object
      additionalProperties: false
      required: [windowId, runs]
      properties:
        windowId:
          type: string
          format: uuid
        runs:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: '#/components/schemas/OfflineBattleRunRequest'
    OfflineBattleSubmissionResponse:
      type: object
      additionalProperties: false
      required: [submissionId, rewardState, acceptedRunIds, anomalyReasons, accountExp, totalAccountExp, economy, replay]
      properties:
        submissionId:
          type: string
          format: uuid
        rewardState:
          type: string
          enum: [GRANTED, HELD, REJECTED]
        acceptedRunIds:
          type: array
          items:
            type: string
            format: uuid
        anomalyReasons:
          type: array
          items:
            type: string
        accountExp:
          type: integer
          format: int64
          minimum: 0
        totalAccountExp:
          type: integer
          format: int64
          minimum: 0
        economy:
          $ref: '#/components/schemas/EconomyResponse'
        replay:
          type: boolean
    BattleStartRequest:
      type: object
      additionalProperties: false
      required: [stageCode, clientBuild]
      properties:
        stageCode:
          type: string
          minLength: 1
          maxLength: 80
          example: STAGE_1
        clientBuild:
          type: string
          minLength: 1
          maxLength: 40
    BattleSessionResponse:
      type: object
      additionalProperties: false
      required: [battleId, stageCode, configVersion, startedAt, expiresAt, replay]
      properties:
        battleId:
          type: string
          format: uuid
        stageCode:
          type: string
          maxLength: 80
        configVersion:
          type: string
        startedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        replay:
          type: boolean
    BattleCompleteRequest:
      type: object
      additionalProperties: false
      required: [outcome, elapsedSeconds, killCount, totalDamage, reachedWave, clientEndedAt]
      properties:
        outcome:
          type: string
          enum: [CLEAR, LOSS, ABANDONED]
        elapsedSeconds:
          type: integer
          description: Negative values remain recordable and cause a held anomaly decision.
        killCount:
          type: integer
          description: Negative values remain recordable and cause a held anomaly decision.
        totalDamage:
          type: number
          multipleOf: 0.0001
          description: Negative values remain recordable and cause a held anomaly decision.
        reachedWave:
          type: integer
          description: Out-of-range values remain recordable and cause a held anomaly decision.
        clientEndedAt:
          type: string
          format: date-time
    BattleCompletionResponse:
      type: object
      additionalProperties: false
      required: [battleId, stageCode, outcome, rewardState, gold, accountExp, totalAccountExp, randomScroll, levelUpCoupon, anomalyReasons, economy, completedAt, replay]
      properties:
        battleId:
          type: string
          format: uuid
        stageCode:
          type: string
        outcome:
          type: string
          enum: [CLEAR, LOSS, ABANDONED]
        rewardState:
          type: string
          enum: [GRANTED, HELD, REJECTED]
        gold:
          type: integer
          format: int64
          minimum: 0
        accountExp:
          type: integer
          format: int64
          minimum: 0
        totalAccountExp:
          type: integer
          format: int64
          minimum: 0
        randomScroll:
          type: integer
          format: int64
          minimum: 0
        levelUpCoupon:
          type: integer
          format: int64
          minimum: 0
        anomalyReasons:
          type: array
          items:
            type: string
        economy:
          $ref: '#/components/schemas/EconomyResponse'
        completedAt:
          type: string
          format: date-time
        replay:
          type: boolean
    BattleHistoryResponse:
      type: object
      additionalProperties: false
      required: [battles]
      properties:
        battles:
          type: array
          items:
            $ref: '#/components/schemas/BattleCompletionResponse'
        nextCursor:
          type: [string, 'null']
          format: uuid
    ApiError:
      type: object
      additionalProperties: false
      required: [code, message, traceId, details]
      properties:
        code:
          type: string
          example: SAVE_REVISION_CONFLICT
        message:
          type: string
          example: The cloud save has changed.
        traceId:
          type: string
        details:
          type: object
          additionalProperties: true
