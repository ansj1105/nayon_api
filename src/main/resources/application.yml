spring:
  application:
    name: nayon-api
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/nayon}
    username: ${DB_USERNAME:nayon}
    password: ${DB_PASSWORD:replace-with-db-password}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${COGNITO_ISSUER_URI:https://cognito-idp.ap-northeast-2.amazonaws.com/replace-with-user-pool-id}
          jwk-set-uri: ${COGNITO_JWK_SET_URI:https://cognito-idp.ap-northeast-2.amazonaws.com/replace-with-user-pool-id/.well-known/jwks.json}

nayon:
  auth:
    client-id: ${COGNITO_CLIENT_ID:replace-with-client-id}
    provider: ${NAYON_AUTH_PROVIDER:}
    provider-claim: nayon:provider
    subject-claim: sub
  korion-wallet-link:
    base-url: ${KORION_WALLET_LINK_BASE_URL:}
    internal-api-key: ${KORION_WALLET_LINK_INTERNAL_API_KEY:}
  store:
    account-hash-key: ${STORE_ACCOUNT_HASH_KEY:}
    google-play:
      package-name: ${GOOGLE_PLAY_PACKAGE_NAME:com.korion.Nayon}
      credentials-file: ${GOOGLE_PLAY_CREDENTIALS_FILE:}
      api-base-url: ${GOOGLE_PLAY_API_BASE_URL:https://androidpublisher.googleapis.com}
      timeout: ${GOOGLE_PLAY_API_TIMEOUT:5s}
  limited-benefit:
    admob:
      keys-url: ${ADMOB_SSV_KEYS_URL:https://www.gstatic.com/admob/reward/verifier-keys.json}
      keys-cache-duration: ${ADMOB_SSV_KEYS_CACHE_DURATION:12h}
      reward-item: ${ADMOB_SSV_REWARD_ITEM:nayon_limited_benefit}
      reward-amount: ${ADMOB_SSV_REWARD_AMOUNT:1}
management:
  endpoints:
    web:
      exposure:
        include: health,info
