name: nayon-prod

services:
  postgres:
    image: postgres:16.4-alpine
    container_name: nayon-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - nayon_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 384m
    networks:
      - nayon-internal

  flyway:
    image: nayon-cloud-migrations:${MIGRATION_TAG:-local}
    build:
      context: ../nayon_cloud
    command: ["-connectRetries=60", "migrate"]
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/${DB_NAME}
      FLYWAY_USER: ${DB_USERNAME}
      FLYWAY_PASSWORD: ${DB_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nayon-internal

  api:
    image: nayon-api:${IMAGE_TAG:-local}
    build:
      context: .
    container_name: nayon-api
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      COGNITO_ISSUER_URI: ${COGNITO_ISSUER_URI}
      COGNITO_JWK_SET_URI: ${COGNITO_JWK_SET_URI}
      COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID}
      NAYON_AUTH_PROVIDER: ${NAYON_AUTH_PROVIDER:-GOOGLE}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=70 -XX:+UseSerialGC
    ports:
      - "127.0.0.1:3200:8080"
    depends_on:
      postgres:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    mem_limit: 512m
    networks:
      - nayon-internal
      - nayon-ingress

volumes:
  nayon_postgres_data:

networks:
  nayon-internal:
    internal: true
  nayon-ingress:
